<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | SaludSync Clone</title>
    <!-- Fuentes Google Fonts para un look premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Iconos Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="layout">

    <!-- Sidebar de Navegación -->
        <!-- Sidebar Container (Dynamic) -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Contenido Principal -->
    <main class="main-content">
        <!-- Header Superior -->
        <header class="top-bar">
            <div class="top-bar__search">
                <span class="material-symbols-rounded">search</span>
                <input type="text" placeholder="Buscar paciente..." class="top-bar__input">
            </div>

            <div class="top-bar__actions">
                <button class="btn btn--primary">
                    <span class="material-symbols-rounded">add</span>
                    Nueva Cita
                </button>
                <div class="top-bar__profile">
                    <img src="https://ui-avatars.com/api/?name=Dr+House&background=0D8ABC&color=fff" alt="Perfil"
                        class="top-bar__avatar">
                </div>
            </div>
        </header>

        <!-- Vista de Agenda -->
        <section class="agenda-view">
            <div class="agenda-header">
                <h2 class="agenda-header__title">Agenda Semanal</h2>
                <div class="agenda-header__controls">
                    <button class="btn btn--icon"><span class="material-symbols-rounded">chevron_left</span></button>
                    <span class="agenda-header__date">Enero 2026</span>
                    <button class="btn btn--icon"><span class="material-symbols-rounded">chevron_right</span></button>
                </div>
                <div class="agenda-header__views">
                    <button class="btn btn--outline btn--active">Semana</button>
                    <button class="btn btn--outline">Día</button>
                </div>
            </div>

            <!-- Grid del Calendario Semanal -->
            <div class="calendar-grid">
                <div class="scheduler">
                    <!-- Header días -->
                    <div class="scheduler__header">
                        <div class="scheduler__time-spacer"></div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Lun</span>
                            <span class="scheduler__day-num">29</span>
                        </div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Mar</span>
                            <span class="scheduler__day-num">30</span>
                        </div>
                        <div class="scheduler__day-col scheduler__day-col--today">
                            <span class="scheduler__day-name">Mié</span>
                            <span class="scheduler__day-num">31</span>
                        </div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Jue</span>
                            <span class="scheduler__day-num">01</span>
                        </div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Vie</span>
                            <span class="scheduler__day-num">02</span>
                        </div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Sáb</span>
                            <span class="scheduler__day-num">03</span>
                        </div>
                        <div class="scheduler__day-col">
                            <span class="scheduler__day-name">Dom</span>
                            <span class="scheduler__day-num">04</span>
                        </div>
                    </div>

                    <!-- Cuerpo Horas + Grid -->
                    <div class="scheduler__body">
                        <!-- Columna Horas -->
                        <div class="scheduler__time-column">
                            <div class="scheduler__time-slot">08:00</div>
                            <div class="scheduler__time-slot">09:00</div>
                            <div class="scheduler__time-slot">10:00</div>
                            <div class="scheduler__time-slot">11:00</div>
                            <div class="scheduler__time-slot">12:00</div>
                            <div class="scheduler__time-slot">13:00</div>
                            <div class="scheduler__time-slot">14:00</div>
                            <div class="scheduler__time-slot">15:00</div>
                            <div class="scheduler__time-slot">16:00</div>
                            <div class="scheduler__time-slot">17:00</div>
                        </div>

                        <!-- Columnas Días (Grid Slots) -->
                        <div class="scheduler__grid-cols">
                            <!-- Lunes -->
                            <div class="scheduler__day-track"></div>

                            <!-- Martes -->
                            <div class="scheduler__day-track">
                                <!-- Cita Ejemplo 1 -->
                                <div class="appt-card appt-card--confirmed" style="top: 60px; height: 60px;">
                                    <div class="appt-card__time">09:00 - 10:00</div>
                                    <div class="appt-card__patient">Juan Pérez</div>
                                    <div class="appt-card__status">Confirmado</div>
                                </div>
                            </div>

                            <!-- Miércoles (Hoy) -->
                            <div class="scheduler__day-track">
                                <!-- Linea de hora actual -->
                                <div class="current-time-line" style="top: 150px;"></div>

                                <div class="appt-card appt-card--pending" style="top: 120px; height: 90px;">
                                    <div class="appt-card__time">10:00 - 11:30</div>
                                    <div class="appt-card__patient">Ana Maria Lopez</div>
                                    <div class="appt-card__status">Pendiente</div>
                                </div>
                            </div>

                            <!-- Jueves -->
                            <div class="scheduler__day-track"></div>

                            <!-- Viernes -->
                            <div class="scheduler__day-track">
                                <div class="appt-card appt-card--canceled" style="top: 240px; height: 60px;">
                                    <div class="appt-card__time">12:00 - 13:00</div>
                                    <div class="appt-card__patient">Carlos Ruiz</div>
                                    <div class="appt-card__status">Cancelado</div>
                                </div>
                            </div>

                            <!-- Sábado -->
                            <div class="scheduler__day-track"></div>

                            <!-- Domingo -->
                            <div class="scheduler__day-track"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

        <script src="assets/js/components/Sidebar.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = new SidebarComponent('#sidebar-container');
            sidebar.render();
        });
    </script>
</body>

</html>
